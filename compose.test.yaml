name: lner-carriage-tests
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: lner
      POSTGRES_PASSWORD: lner_test_only
      POSTGRES_DB: lner_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lner -d lner_test]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    image: lner-analyser:tests
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://lner:lner_test_only@db:5432/lner_test
      STORAGE_DIR: /tmp/lner-test-storage
    depends_on:
      db:
        condition: service_healthy
