name: lner-rotation-planner-tests
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner_test_only
      POSTGRES_DB: planner_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U planner -d planner_test]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: lner-rotation-planner:tests
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://planner:planner_test_only@db:5432/planner_test
    depends_on:
      db:
        condition: service_healthy
