name: Application checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: lner
          POSTGRES_PASSWORD: lner_test_only
          POSTGRES_DB: lner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lner -d lner_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://lner:lner_test_only@localhost:5432/lner_test
      TEST_DATABASE_URL: postgresql://lner:lner_test_only@localhost:5432/lner_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
