name: Planner roster and rotation checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_test_only
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://planner:planner_test_only@localhost:5432/planner_test
      TEST_DATABASE_URL: postgresql://planner:planner_test_only@localhost:5432/planner_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-browser-results
          path: test-results/
          if-no-files-found: ignore
